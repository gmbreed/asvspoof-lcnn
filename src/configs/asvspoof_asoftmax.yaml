defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof
  - dataloader: asvspoof
  - transforms: asvspoof
  - loss_function: a_softmax  # A-Softmax
  - _self_

dataset_root: /kaggle/input/asvspoof2019/LA

model:
  angular: true  # AngleLinear head required by A-Softmax
  angular_m: 4   # SphereFace margin

optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
  weight_decay: 1e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.95  # stretched so lr survives the full 100 epochs
  step_size: ${trainer.epoch_len}

writer:
  project_name: "asvspoof_lcnn"
  run_name: "lcnn_asoftmax"

trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: 500
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: False
  monitor: "min val_EER"
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
